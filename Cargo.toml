[package]
name = "vortex"
version = "0.2.0"
edition = "2021"
description = "Minimal TUI VPN/proxy manager for Omarchy — VLESS, VMess, Trojan, SS, Hysteria2, TUIC, WireGuard, AmneziaWG, OpenVPN"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
flate2 = "1"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
