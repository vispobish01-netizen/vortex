[workspace]
members = [
    "crates/vortex-core",
    "crates/vortexd",
    "crates/vortex",
]
default-members = [
    "crates/vortex-core",
    "crates/vortexd",
    "crates/vortex",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vispobish01-netizen/vortex"
homepage = "https://github.com/vispobish01-netizen/vortex"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
