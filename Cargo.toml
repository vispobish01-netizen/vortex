[workspace]
members = [
    "crates/vortex-core",
    "crates/vortexd",
    "crates/vortex",
    "crates/vortex-tui",
]
default-members = [
    "crates/vortex-core",
    "crates/vortexd",
    "crates/vortex",
    "crates/vortex-tui",
]
resolver = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
