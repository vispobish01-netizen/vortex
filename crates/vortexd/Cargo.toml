[package]
name = "vortexd"
version = "0.3.0"
edition = "2021"
description = "Background daemon service for Vortex VPN/proxy manager"

[[bin]]
name = "vortexd"
path = "src/main.rs"

[dependencies]
vortex-core = { path = "../vortex-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
libc = "0.2"
