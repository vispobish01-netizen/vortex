[package]
name = "vortex-tui"
version = "0.3.0"
edition = "2021"
description = "Terminal client (ratatui) for Vortex VPN/proxy manager — pure daemon client"

[[bin]]
name = "vortex-tui"
path = "src/main.rs"

[dependencies]
vortex-core = { path = "../vortex-core" }
tokio = { version = "1", features = ["full"] }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
