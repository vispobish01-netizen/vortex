# Vortex VPN & Proxy Manager Keybindings for Hyprland
# Include this in your ~/.config/hypr/hyprland.conf or ~/.config/hypr/bindings.lua

# Super+V: Instant toggle connection (connect fastest/last if down, disconnect if up)
bind = $mainMod, V, exec, vortex toggle

# Super+Shift+V: Quick interactive node picker (fuzzel / rofi / wofi / zenity)
bind = $mainMod SHIFT, V, exec, vortex pick

# Super+Alt+V: Toggle nftables stealth kill-switch shield
bind = $mainMod ALT, V, exec, vortex shield
